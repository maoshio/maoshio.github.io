    <style>:root{font-family:Arial,Helvetica,sans-serif;color:#eef2f5;background:#090b0d;font-synthesis:none;--bg: #090b0d;--surface: #101419;--surface-raised: #171d24;--line: #303945;--muted: #8e9aa8;--text: #eef2f5;--amber: #f2b84b;--amber-dark: #4e3715;--green: #52c97a;--red: #ef6262;--orange: #f28b45;--gold: #d3a44a}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg)}button,input,select{font:inherit}.app-shell{min-height:100vh;background:linear-gradient(180deg,#0d1115 0,#090b0d 240px)}.topbar{min-height:92px;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.eyebrow,.surface-kicker{color:var(--amber);font-size:.75rem;letter-spacing:.14em}h1{margin:5px 0 0;font-size:1.65rem;font-weight:700}.privacy-note{color:var(--green);font-size:.85rem}.workflow-tabs{display:flex;padding:0 28px;border-bottom:1px solid var(--line);background:#0d1115}.workflow-tab{border:0;border-right:1px solid var(--line);padding:13px 18px;color:var(--muted);background:transparent;cursor:pointer}.workflow-tab:first-child{border-left:1px solid var(--line)}.workflow-tab.active{color:#14100a;background:var(--amber);font-weight:700}.app-content{padding:28px}.page-heading,.workspace-toolbar{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:20px}.page-heading h2,.workspace-toolbar h2{margin:6px 0 0;font-size:1.55rem}.page-heading>p,.workspace-toolbar p{color:var(--muted);margin:0;max-width:540px}.intake-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px}.panel{border:1px solid var(--line);background:var(--surface)}.upload-panel,.sales-panel,.pivot-builder,.pivot-output{padding:20px}.panel-title{display:flex;align-items:center;gap:10px;margin-bottom:16px}.panel-title span{color:var(--amber);font-size:.72rem;letter-spacing:.12em}.panel-title h3{margin:0;font-size:1rem;text-transform:uppercase}.file-drop{position:relative;display:grid;gap:6px;margin-top:12px;padding:18px;border:1px dashed #52606f;background:#0c1014;cursor:pointer}.file-drop:hover{border-color:var(--amber)}.file-drop>span,.sales-grid label span,.config-box>span{color:var(--amber);font-size:.72rem;letter-spacing:.08em}.file-drop small,.panel-help{color:var(--muted)}.file-drop input{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;cursor:pointer}.sales-grid{display:grid;gap:9px}.sales-grid label{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:12px}input,select{color:var(--text);border:1px solid var(--line);background:#090c0f;padding:9px 10px}.validation-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin:16px 0;border:1px solid var(--line);background:var(--line)}.metric-card{display:grid;gap:8px;background:var(--surface);padding:16px}.metric-card span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.metric-card strong{font-size:1.55rem;font-variant-numeric:tabular-nums}.metric-card.success strong{color:var(--green)}.metric-card.warning strong{color:var(--orange)}.metric-card.danger strong{color:var(--red)}.metric-card.accent strong{color:var(--amber)}.quality-panel{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 20px}.quality-panel h3,.quality-panel p{margin:0}.quality-panel p{margin-top:5px;color:var(--muted)}.primary-button,.secondary-button{border:1px solid var(--amber);padding:10px 16px;cursor:pointer}.primary-button{color:#191106;background:var(--amber);font-weight:700}.primary-button:disabled{cursor:not-allowed;opacity:.35}.secondary-button{color:var(--amber);background:transparent}.status-line{color:var(--green)}.error-line{color:var(--red)}.toolbar-actions{display:flex;flex-wrap:wrap;gap:8px}.export-status{text-align:right;font-size:.78rem}.report-panel{padding:0}.table-scroll{overflow:auto;max-height:520px}.data-table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}.data-table th,.data-table td{min-width:90px;padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:right}.data-table th:first-child,.data-table td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:#11161b}.data-table thead th{position:sticky;top:0;z-index:2;color:var(--amber);background:#151a20}.data-table thead th:first-child{z-index:3}.total-row th,.total-row td{background:#2a2114;color:#ffd47c;font-weight:700}.pivot-section{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;margin-top:16px}.field-box h4{margin:0 0 8px;color:var(--muted);font-size:.8rem;text-transform:uppercase}.field-chips{display:flex;flex-wrap:wrap;gap:6px}.field-chips span,.field-chips button{padding:5px 7px;border:1px solid var(--line);color:var(--text);background:#0a0d10;font-family:ui-monospace,monospace;font-size:.72rem}.zone-actions{display:flex;gap:6px;margin-top:7px}.zone-actions button{flex:1;color:var(--amber);border:1px solid var(--line);background:#0a0d10;padding:6px;cursor:pointer}.config-box{display:grid;gap:7px;margin-top:12px;padding:12px;border:1px solid var(--line)}.config-box strong{font-size:.82rem}.compact th,.compact td{padding:7px 9px}.cell-button{width:100%;border:0;color:var(--amber);background:transparent;text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}.vin-drawer{position:fixed;z-index:20;top:0;right:0;width:min(440px,92vw);height:100vh;padding:22px;border-left:1px solid var(--amber);background:#0d1115;box-shadow:-16px 0 40px #000a;transform:translate(102%);transition:transform .18s ease}.vin-drawer.open{transform:translate(0)}.drawer-head{display:flex;justify-content:space-between;align-items:start}.drawer-head h3{margin:5px 0}.drawer-head button{color:var(--text);border:1px solid var(--line);background:transparent;padding:7px 10px}.vin-list{display:grid;gap:1px;max-height:calc(100vh - 140px);overflow:auto;background:var(--line)}.vin-list code{padding:8px 10px;background:#11161b}.rules-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.rule-card,.settings-panel{padding:18px}.rule-card h3{margin:0 0 12px;font-size:.83rem;color:var(--amber);text-transform:uppercase}.rule-card h3:not(:first-child){margin-top:24px}.rule-add{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin-bottom:12px}.rule-add button,.tag-list button{border:1px solid var(--line);color:var(--text);background:#161c22;cursor:pointer}.rule-list{max-height:440px;overflow:auto}.rule-list>div{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-top:6px}.tag-list{display:flex;flex-wrap:wrap;gap:6px}.tag-list button{padding:7px 9px;text-align:left}.inline-rule{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin-top:6px}.inline-rule span{color:var(--muted);font-size:.78rem}.settings-panel{margin-top:16px}.settings-actions{display:flex;flex-wrap:wrap;gap:8px}.settings-panel textarea{width:100%;min-height:180px;margin-top:14px;color:#c9d2dc;border:1px solid var(--line);background:#090c0f;padding:12px;font-family:ui-monospace,monospace;font-size:.75rem}.empty-surface{max-width:760px;min-height:300px;border:1px solid var(--line);background:var(--surface);padding:28px}.empty-surface h2{margin:10px 0;font-size:1.45rem}.empty-surface p:last-child{color:var(--muted);font-size:1rem}@media(max-width:720px){.topbar{align-items:flex-start;gap:16px;flex-direction:column}.workflow-tabs{overflow-x:auto;padding:0 14px}.workflow-tab{white-space:nowrap}.app-content{padding:16px}.page-heading,.workspace-toolbar,.quality-panel{align-items:flex-start;flex-direction:column}.intake-grid,.pivot-section,.rules-grid{grid-template-columns:1fr}.validation-strip{grid-template-columns:repeat(2,1fr)}}
</style>
  </head>

    <div id="root"></div>
